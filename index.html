    <!-- High-Performance Preload for critical hero image (LCP) -->
    <link rel="preload" href="/assets/leticia-main.jpg" as="image" />
    
    <!-- Professional protection: prevents right-click, image dragging, and devtools shortcuts -->
    <script>
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.keyCode === 123 || 
          (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
          (e.ctrlKey && e.keyCode === 85)
        ) {
          e.preventDefault();
        }
      });
    </script>
